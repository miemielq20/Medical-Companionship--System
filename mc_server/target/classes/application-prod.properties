# ========== 生产环境配置 ==========
spring.application.name=mc_vue


# 服务端口（宝塔中如端口冲突可改）
server.port=8080


# MySQL（宝塔中安装的 MySQL，按实际修改账号密码）
spring.datasource.url=jdbc:mysql://localhost:3306/mc_sys?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=aZhTnTG97XKX4JbY
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.type-handlers-package=com.example.mc_vue.common.handler
mybatis-plus.global-config.db-config.logic-delete-field=deleted

# Redis（宝塔中安装的 Redis）
spring.data.redis.host=localhost
spring.data.redis.port=6379

# PageHelper
pagehelper.helperDialect=mysql
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

# 短信（容联云）
sms.account-id=2c94811c870df4c80187229dfc6e03ab
sms.auth-token=216f3ae9aa17438c85a3971395c3dcc9
sms.app-id=2c94811c9dfd83b1019e014dcb0b1081

# ---------- 生产环境日志 ----------
logging.level.com.example.mc_server.mapper=WARN
logging.level.com.github.pagehelper=WARN
logging.level.root=INFO

# 日志输出到文件（宝塔中方便查看）
logging.file.path=/www/wwwlogs/mc_server
logging.file.name=${logging.file.path}/app.log
